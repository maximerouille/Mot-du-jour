<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot du Jour</title>
  <meta name="description" content="Un mot français chaque jour pour enrichir votre vocabulaire" />
  <meta name="theme-color" content="#1a0a2e" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root { --ink:#1a0a2e; --parchment:#f5efe6; --gold:#c9974a; --rose:#9b4d6e; --sage:#4a7c6b; --muted:#9c8d7c; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:radial-gradient(circle at 20% 20%,rgba(201,151,74,.12),transparent 35%), var(--ink); color:var(--parchment); font-family: Georgia, serif; display:flex; justify-content:center; align-items:center; padding:24px; }
    .app { width:100%; max-width:520px; text-align:center; }
    h1 { font-size:2.2rem; font-weight:400; margin-bottom:8px; }
    .label, .date, .number { text-transform:uppercase; letter-spacing:.22em; font-size:.72rem; color:var(--gold); }
    .date { color:var(--muted); margin:24px 0; }
    .card { border:1px solid rgba(201,151,74,.28); background:rgba(245,239,230,.045); padding:38px 28px; margin-bottom:18px; }
    .word { font-size:clamp(2.7rem, 10vw, 4.5rem); color:var(--parchment); margin:14px 0 8px; font-weight:700; }
    .phonetic { color:var(--gold); opacity:.75; font-style:italic; margin-bottom:12px; }
    .type { display:inline-block; border:1px solid rgba(155,77,110,.45); color:var(--rose); padding:4px 12px; text-transform:uppercase; letter-spacing:.18em; font-size:.68rem; margin-bottom:18px; }
    .definition { font-size:1.15rem; line-height:1.65; margin:18px 0; }
    .example { color:var(--muted); font-style:italic; line-height:1.5; }
    .etym { border:1px solid rgba(74,124,107,.25); background:rgba(74,124,107,.08); padding:14px 18px; font-size:.9rem; color:rgba(245,239,230,.72); line-height:1.5; margin-bottom:16px; }
    button { width:100%; padding:14px 16px; margin-top:10px; border:0; background:var(--gold); color:var(--ink); font-weight:700; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; }
    .secondary { background:transparent; color:var(--parchment); border:1px solid rgba(245,239,230,.2); }
    .status { margin-top:16px; font-size:.85rem; color:var(--muted); }
    .hint { margin-top:18px; font-size:.82rem; color:rgba(245,239,230,.6); line-height:1.45; }
  </style>
</head>
<body>
  <main class="app">
    <div class="label">Enrichissez votre vocabulaire</div>
    <h1>Mot du Jour</h1>
    <div class="date" id="dateBadge"></div>

    <section class="card">
      <div class="number" id="wordNumber"></div>
      <div class="word" id="wordDisplay"></div>
      <div class="phonetic" id="wordPhonetic"></div>
      <div class="type" id="wordType"></div>
      <div class="definition" id="wordDefinition"></div>
      <div class="example" id="wordExample"></div>
    </section>

    <div class="etym" id="wordEtymology"></div>

    <button onclick="enableNotifications()" id="notifBtn">🔔 Activer les notifications</button>
    <button class="secondary" onclick="shareWord()">Partager</button>
    <div class="status" id="status">Notifications désactivées.</div>
    <div class="hint">Sur iPhone : ouvrez cette page dans Safari, appuyez sur Partager, puis “Sur l’écran d’accueil”. Ensuite ouvrez l’app installée et activez les notifications.</div>
  </main>

<script>
const mots = [
  { mot:'Bonjour', phonetique:'/bɔ̃.ʒuʁ/', type:'exclamation', definition:"Formule de politesse utilisée pour saluer quelqu'un dans la journée.", exemple:"Bonjour ! Comment allez-vous aujourd'hui ?", etymologie:'De bon et jour : “bonne journée”.' },
  { mot:'Manger', phonetique:'/mɑ̃.ʒe/', type:'verbe', definition:"Mettre de la nourriture dans sa bouche, la mâcher et l'avaler.", exemple:"J'aime manger des croissants le matin.", etymologie:'Du latin manducare, mâcher.' },
  { mot:'Maison', phonetique:'/mɛ.zɔ̃/', type:'nom féminin', definition:'Bâtiment où des personnes habitent, vivent et dorment.', exemple:'Ma maison a un grand jardin.', etymologie:'Du latin mansio, demeure.' },
  { mot:'Ami', phonetique:'/a.mi/', type:'nom masculin', definition:"Personne avec qui on s'entend bien et qu'on apprécie.", exemple:"Mon meilleur ami s'appelle Lucas.", etymologie:'Du latin amicus, de amare, aimer.' },
  { mot:'Apprendre', phonetique:'/a.pʁɑ̃dʁ/', type:'verbe', definition:"Acquérir de nouvelles connaissances ou compétences.", exemple:'Elle apprend le français depuis six mois.', etymologie:'Du latin apprehendere, saisir.' },
  { mot:'Voyager', phonetique:'/vwa.ja.ʒe/', type:'verbe', definition:"Se déplacer d'un endroit à un autre pour découvrir de nouveaux lieux.", exemple:'Elle rêve de voyager au Japon.', etymologie:'De voyage, du latin viaticum.' },
  { mot:'Éphémère', phonetique:'/e.fe.mɛʁ/', type:'adjectif', definition:'Qui ne dure que très peu de temps.', exemple:'La beauté de ce coucher de soleil est éphémère.', etymologie:'Du grec ephêmeros, qui dure un jour.' }
];

let currentWord = null;

function getDayIndex() {
  const origin = new Date('2024-01-01T00:00:00Z');
  const today = new Date();
  return Math.floor((today - origin) / 86400000) % mots.length;
}

function render() {
  currentWord = mots[getDayIndex()];
  const opts = { weekday:'long', day:'numeric', month:'long', year:'numeric' };
  const date = new Date().toLocaleDateString('fr-FR', opts);
  document.getElementById('dateBadge').textContent = date.charAt(0).toUpperCase() + date.slice(1);
  document.getElementById('wordNumber').textContent = `Mot #${getDayIndex() + 1}`;
  document.getElementById('wordDisplay').textContent = currentWord.mot;
  document.getElementById('wordPhonetic').textContent = currentWord.phonetique;
  document.getElementById('wordType').textContent = currentWord.type;
  document.getElementById('wordDefinition').textContent = currentWord.definition;
  document.getElementById('wordExample').textContent = `« ${currentWord.exemple} »`;
  document.getElementById('wordEtymology').textContent = `Étymologie — ${currentWord.etymologie}`;
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
}

async function enableNotifications() {
  const status = document.getElementById('status');

  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    status.textContent = 'Notifications push non supportées sur ce navigateur.';
    return;
  }

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    status.textContent = 'Permission refusée. Vérifiez les réglages du téléphone.';
    return;
  }

  const config = await fetch('/api/config').then((r) => r.json());
  if (!config.vapidPublicKey) {
    status.textContent = 'Erreur : VAPID_PUBLIC_KEY manque sur Vercel.';
    return;
  }

  const registration = await navigator.serviceWorker.ready;
  const subscription = await registration.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(config.vapidPublicKey)
  });

  const response = await fetch('/api/subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(subscription)
  });

  if (response.ok) {
    status.textContent = '✅ Notifications activées. Vous recevrez le mot du jour chaque matin.';
    document.getElementById('notifBtn').textContent = '✅ Notifications activées';
  } else {
    status.textContent = 'Erreur pendant l’enregistrement de votre téléphone.';
  }
}

function shareWord() {
  const text = `✨ Mot du jour : ${currentWord.mot}\n\n${currentWord.definition}\n\nExemple : ${currentWord.exemple}`;
  if (navigator.share) navigator.share({ title:'Mot du Jour', text });
  else navigator.clipboard.writeText(text);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
render();
</script>
</body>
</html>
